<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>발전기를 고쳐라! - 팬 미니게임</title>
<style>
:root{
  --bg:#120d1c; --panel:#221a33; --panel2:#2d2344; --line:#4a3b6b;
  --ink:#f6efff; --dim:#b3a6cf; --red:#ff5468; --yellow:#ffd65a; --green:#6dffa0; --purple:#b48cff;
  --font:"Jua","Arial Rounded MT Bold","Cafe24 Ssurround","NanumSquareRound","Nanum Gothic",ui-rounded,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%}
button{font-family:inherit;color:inherit;cursor:pointer;border:0}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;display:none}
#hud.on{display:block}
.pill{position:absolute;top:10px;background:rgba(20,14,32,.78);border:2px solid var(--line);border-radius:999px;
  padding:6px 14px;font-size:18px;line-height:1.2;display:flex;align-items:center;gap:8px;white-space:nowrap}
#hp{left:10px}
#hp span{font-size:24px;color:var(--red);transition:transform .2s,opacity .2s;text-shadow:0 2px 0 #7a1326}
#hp span.off{color:#4b3d5f;text-shadow:none;transform:scale(.8)}
#gens{left:50%;transform:translateX(-50%)}
#gens i{width:14px;height:14px;border-radius:50%;background:#4b3d5f;border:2px solid #6b5a8c;display:inline-block}
#gens i.ok{background:var(--yellow);border-color:#fff3b8;box-shadow:0 0 8px var(--yellow)}
#timeBox{right:10px;font-variant-numeric:tabular-nums}
#mute{pointer-events:auto;background:none;font-size:18px;padding:0 0 0 6px;border-left:2px solid var(--line);border-radius:0}
#goal{position:absolute;top:56px;left:50%;transform:translateX(-50%);font-size:16px;color:var(--dim);
  background:rgba(20,14,32,.6);padding:4px 14px;border-radius:999px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#goal.open{color:#0d2b18;background:var(--green);font-size:18px}
#toast{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-size:30px;text-align:center;
  text-shadow:0 3px 0 #000,0 0 18px rgba(0,0,0,.8);opacity:0;transition:opacity .3s;white-space:nowrap}
#toast.on{opacity:1}

/* ---------- 조작 버튼 ---------- */
#pad{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:14px;align-items:flex-end;pointer-events:auto}
.rb{width:92px;height:92px;border-radius:50%;font-size:20px;position:relative;overflow:hidden;
  border:4px solid rgba(255,255,255,.55);box-shadow:0 6px 0 rgba(0,0,0,.45);touch-action:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.rb small{font-size:12px;opacity:.85;margin-top:3px}
.rb.down{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
#bFix{background:#e9a92b;color:#2b1c00}
#bFix.near{animation:pop .7s infinite alternate}
#bAb{background:#8d5cf0;color:#fff;width:80px;height:80px;font-size:17px}
#bAb .cd{position:absolute;inset:0;background:conic-gradient(rgba(10,6,20,.78) var(--cd,0deg),transparent 0);pointer-events:none}
#bAb .num{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:30px;text-shadow:0 2px 0 #000}
#bAb.wait .num{display:flex}
#bAb.wait .lab{opacity:.25}
@keyframes pop{from{transform:scale(1)}to{transform:scale(1.08)}}
#joyZone{position:absolute;left:0;bottom:0;width:50%;height:70%;pointer-events:none;touch-action:none}
.touch #joyZone{pointer-events:auto}
#joy{position:absolute;width:130px;height:130px;border-radius:50%;margin:-65px 0 0 -65px;
  background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.35);display:none}
.touch #joy{display:block}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
  background:rgba(255,255,255,.55);border:3px solid #fff}
.touch .rb small{display:none}
.touch .rb{width:104px;height:104px}
.touch #bAb{width:90px;height:90px}

/* ---------- 화면(시작/결과) ---------- */
.screen{position:absolute;inset:0;display:none;overflow:auto;-webkit-overflow-scrolling:touch;
  background:radial-gradient(ellipse at 50% 0%,#33234f 0%,#120d1c 65%);padding:18px 14px 28px;touch-action:pan-y}
.screen.on{display:block}
.wrap{max-width:980px;margin:0 auto;text-align:center}
h1{font-size:clamp(30px,6vw,52px);margin:8px 0 2px;font-weight:400;letter-spacing:1px;text-wrap:balance;
  text-shadow:0 4px 0 #5a2fb0,0 8px 18px rgba(0,0,0,.6)}
h1 b{color:var(--yellow);font-weight:400}
.sub{color:var(--dim);font-size:16px;margin:0 0 14px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--panel);border:4px solid var(--line);border-radius:22px;padding:10px 8px 12px;cursor:pointer;
  transition:transform .15s,border-color .15s,background .15s;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.card:hover{transform:translateY(-3px)}
.card.sel{border-color:var(--yellow);background:var(--panel2);transform:translateY(-6px) rotate(-1deg);box-shadow:0 10px 0 rgba(0,0,0,.35),0 0 24px rgba(255,214,90,.35)}
.card .pic{height:150px;width:100%;display:flex;align-items:flex-end;justify-content:center;
  background:radial-gradient(ellipse at 50% 70%,#efe6ff 0%,#c9b8ea 60%,#a892d4 100%);border-radius:14px;padding-top:8px;overflow:hidden}
.card img{max-height:140px;max-width:92%;display:block;pointer-events:none}
.card.sel img{animation:bob .5s infinite alternate ease-in-out}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
.card input{width:100%;font-family:inherit;font-size:19px;text-align:center;color:var(--ink);background:#150f22;
  border:2px dashed var(--line);border-radius:10px;padding:5px 4px;outline:none;-webkit-user-select:text;user-select:text}
.card input:focus{border-color:var(--yellow);border-style:solid}
.card .ab{font-size:16px;color:var(--yellow)}
.card .ds{font-size:13px;color:var(--dim);line-height:1.35;text-wrap:pretty;min-height:2.7em}
.big{margin-top:16px;font-size:26px;padding:12px 44px;border-radius:999px;background:var(--yellow);color:#2b1c00;
  box-shadow:0 6px 0 #a87a10;transition:transform .1s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #a87a10}
.big[disabled]{background:#544669;color:#8e80a8;box-shadow:0 6px 0 #33284a;cursor:default}
.ghost{margin:16px 0 0 10px;font-size:18px;padding:12px 22px;border-radius:999px;background:transparent;border:3px solid var(--line);color:var(--dim)}
.how{margin:16px auto 0;max-width:720px;background:rgba(20,14,32,.6);border:2px solid var(--line);border-radius:16px;
  padding:10px 14px;font-size:14px;color:var(--dim);line-height:1.6;text-align:left}
.how b{color:var(--ink);font-weight:400}
.foot{margin-top:10px;font-size:12px;color:#7d6f99}
#end .box{text-align:center;max-width:460px;margin:8vh auto 0;background:var(--panel);border:4px solid var(--line);border-radius:26px;padding:18px 18px 24px}
#end img{height:130px;display:block;margin:0 auto 4px}
#end h2{font-size:40px;margin:4px 0;font-weight:400}
#end.win h2{color:var(--green)} #end.lose h2{color:var(--red)}
#end.lose img{filter:grayscale(.8);transform:rotate(-8deg)}
#end .t{font-size:54px;font-variant-numeric:tabular-nums;margin:6px 0 0}
#end .m{color:var(--dim);font-size:16px;margin:4px 0 0}
@media (max-width:720px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .card .pic{height:120px}.card img{max-height:112px}
  .pill{font-size:15px;padding:5px 10px}#hp span{font-size:20px}
  #goal{font-size:13px;top:50px}
}
@media (max-height:480px){
  h1{font-size:28px;margin:0}.sub{margin-bottom:8px;font-size:13px}
  .cards{grid-template-columns:repeat(4,1fr)}
  .card .pic{height:92px}.card img{max-height:86px}.card .ds{display:none}
  .how{display:none}.big{margin-top:10px;font-size:22px;padding:8px 36px}
  #end .box{margin-top:2vh;padding:10px}#end img{height:80px}#end .t{font-size:40px}#end h2{font-size:30px}
  .touch .rb{width:88px;height:88px}.touch #bAb{width:76px;height:76px}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="pill" id="hp"><span>♥</span><span>♥</span><span>♥</span></div>
    <div class="pill" id="gens">발전기 <i></i><i></i><i></i><i></i></div>
    <div class="pill" id="timeBox"><span id="time">0:00.0</span><button id="mute" aria-label="소리 켜기/끄기">🔊</button></div>
    <div id="goal">발전기 4개를 모두 고치자!</div>
    <div id="toast"></div>
    <div id="joyZone"><div id="joy"><div id="knob"></div></div></div>
    <div id="pad">
      <button class="rb" id="bAb"><span class="lab" id="abLab">능력</span><small>Shift</small><span class="cd"></span><span class="num" id="abNum"></span></button>
      <button class="rb" id="bFix"><span>수리</span><small>스페이스</small></button>
    </div>
  </div>

  <div class="screen on" id="menu">
    <div class="wrap">
      <h1><b>발전기</b>를 고쳐라!</h1>
      <p class="sub">생존자를 한 명 골라서, 킬러를 피해 탈출하자</p>
      <div class="cards" id="cards"></div>
      <button class="big" id="go" disabled>캐릭터를 골라줘</button>
      <div class="how">
        <b>목표</b> 발전기 4개를 고치면 출구가 열려요. 초록 문으로 달려가면 승리!<br>
        <b>PC</b> 방향키·WASD 이동 / 스페이스 꾹 수리 / Shift 능력 &nbsp; <b>태블릿</b> 왼쪽 조이스틱 + 오른쪽 버튼<br>
        <b>조심</b> 킬러한테 닿으면 하트가 하나 줄어요. 화면이 빨개지고 심장 소리가 나면 가까이 온 거예요.
      </div>
      <div class="foot">Roblox 게임 "Forsaken"을 좋아해서 만든 비공식 팬 미니게임 · 그림: 직접 그린 손그림</div>
    </div>
  </div>

  <div class="screen" id="end">
    <div class="box">
      <img id="endImg" alt="">
      <h2 id="endTitle"></h2>
      <div class="m" id="endMsg"></div>
      <div class="t" id="endTime"></div>
      <div class="m" id="endBest"></div>
      <button class="big" id="again">다시 하기</button><button class="ghost" id="toMenu">캐릭터 바꾸기</button>
    </div>
  </div>
</div>

const $ = s => document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rand=(a,b)=>a+Math.random()*(b-a);
function fmt(t){const m=Math.floor(t/60), s=t-m*60; return m+':'+(s<10?'0':'')+s.toFixed(1);}

/* ================= 스프라이트 ================= */
const IMG={}, GLOW={};
let loaded=0;
function makeGlow(id,color){
  const im=IMG[id], pad=22, c=document.createElement('canvas');
  c.width=im.width+pad*2; c.height=im.height+pad*2;
  const g=c.getContext('2d');
  g.shadowColor=color; g.shadowBlur=12;
  for(let i=0;i<3;i++) g.drawImage(im,pad,pad);
  g.shadowBlur=0; g.shadowColor='transparent';
  g.drawImage(im,pad,pad);              // 원본 그림은 그대로 맨 위에
  GLOW[id]={c,pad,w:im.width,h:im.height};
}
for(const id in SPR){
  const im=new Image();
  im.onload=()=>{ makeGlow(id, id==='s5'?'rgba(255,70,110,.95)':'rgba(255,255,255,.9)'); loaded++; };
  im.src=SPR[id].d; IMG[id]=im;
}

/* ================= 맵 준비 ================= */
let solids=[], gens=[], blocked=new Uint8Array(COLS*ROWS);
function buildWorld(){
  gens = GEN_POS.map((g,i)=>({x:g.x,y:g.y,w:80,h:40,t:'gen',i,prog:0,done:false,cx:g.x+40,cy:g.y+20,spark:0}));
  solids = SOLIDS.concat(gens);
  blocked.fill(0);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(c===0||r===0||c===COLS-1||r===ROWS-1){blocked[r*COLS+c]=1;continue;}
    const x=c*CELL,y=r*CELL;
    for(const s of solids) if(x<s.x+s.w&&x+CELL>s.x&&y<s.y+s.h&&y+CELL>s.y){blocked[r*COLS+c]=1;break;}
  }
}
// 바닥·벽은 한 번만 그려 두기
const mapCv=document.createElement('canvas'); mapCv.width=W; mapCv.height=H;
function paintMap(){
  const g=mapCv.getContext('2d');
  g.fillStyle='#2a2238'; g.fillRect(0,0,W,H);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const v=((c*7+r*13)%5);
    g.fillStyle=(c+r)%2? '#2e2540':'#2a2139'; g.fillRect(c*CELL,r*CELL,CELL,CELL);
    if(v===0){g.fillStyle='rgba(255,255,255,.025)';g.fillRect(c*CELL+6,r*CELL+6,CELL-12,CELL-12);}
  }
  g.strokeStyle='rgba(0,0,0,.22)'; g.lineWidth=2;
  for(let x=0;x<=W;x+=CELL*2){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();}
  for(let y=0;y<=H;y+=CELL*2){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
  // 얼룩
  for(let i=0;i<26;i++){
    const x=(i*397)%W, y=(i*641)%H, rr=30+(i*53)%60;
    const gr=g.createRadialGradient(x,y,0,x,y,rr); gr.addColorStop(0,'rgba(10,6,20,.35)'); gr.addColorStop(1,'rgba(10,6,20,0)');
    g.fillStyle=gr; g.fillRect(x-rr,y-rr,rr*2,rr*2);

  // 바깥 벽

  g.fillStyle='#3c2f58'; g.fillRect(WALL-6,WALL-6,W-2*WALL+12,6); g.fillRect(WALL-6,WALL-6,6,H-2*WALL+12);
  g.fillRect(W-WALL,WALL-6,6,H-2*WALL+12); g.fillRect(WALL-6,H-WALL,W-2*WALL+12,6);
  for(const s of SOLIDS){
    g.fillStyle='rgba(0,0,0,.35)'; g.fillRect(s.x+6,s.y+10,s.w,s.h);
    if(s.t==='wall'){
      g.fillStyle='#4a3c68'; g.fillRect(s.x,s.y,s.w,s.h);
      g.fillStyle='#5d4d82'; g.fillRect(s.x,s.y,s.w,8);
      g.fillStyle='#3a2e54'; g.fillRect(s.x,s.y+s.h-8,s.w,8);
      g.strokeStyle='rgba(0,0,0,.25)'; g.lineWidth=2;
      for(let x=s.x+40;x<s.x+s.w;x+=40){g.beginPath();g.moveTo(x,s.y+8);g.lineTo(x,s.y+s.h-8);g.stroke();}
      for(let y=s.y+40;y<s.y+s.h;y+=40){g.beginPath();g.moveTo(s.x,y);g.lineTo(s.x+s.w,y);g.stroke();}
    }else{
      g.fillStyle='#8a6238'; g.fillRect(s.x,s.y,s.w,s.h);
      g.fillStyle='#a67a48'; g.fillRect(s.x+5,s.y+5,s.w-10,s.h-10);
      g.strokeStyle='#5f4122'; g.lineWidth=4; g.strokeRect(s.x+2,s.y+2,s.w-4,s.h-4);
      g.beginPath(); g.moveTo(s.x+6,s.y+6); g.lineTo(s.x+s.w-6,s.y+s.h-6); g.moveTo(s.x+s.w-6,s.y+6); g.lineTo(s.x+6,s.y+s.h-6); g.stroke();
    }
  }
}

/* ================= 충돌·시야 ================= */
function pushOut(o,r){
  for(let it=0;it<2;it++){
    for(const s of solids){
      const nx=clamp(o.x,s.x,s.x+s.w), ny=clamp(o.y,s.y,s.y+s.h);
      let dx=o.x-nx, dy=o.y-ny, d2=dx*dx+dy*dy;
      if(d2>=r*r) continue;
      if(d2>1e-6){const d=Math.sqrt(d2); o.x=nx+dx/d*r; o.y=ny+dy/d*r;}
      else{ // 안에 들어감 → 가장 가까운 면으로
        const l=o.x-s.x, ri=s.x+s.w-o.x, t=o.y-s.y, b=s.y+s.h-o.y, m=Math.min(l,ri,t,b);
        if(m===l)o.x=s.x-r; else if(m===ri)o.x=s.x+s.w+r; else if(m===t)o.y=s.y-r; else o.y=s.y+s.h+r;
      }
    }
  }
  o.x=clamp(o.x,WALL+r,W-WALL-r); o.y=clamp(o.y,WALL+r,H-WALL-r);
}
function moveBy(o,dx,dy,r){
  const n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/8));
  for(let i=0;i<n;i++){o.x+=dx/n;o.y+=dy/n;pushOut(o,r);}
}
function segHits(x1,y1,x2,y2,pad){
  const dx=x2-x1, dy=y2-y1;
  for(const s of solids){
    let t0=0,t1=1; const minx=s.x-pad,maxx=s.x+s.w+pad,miny=s.y-pad,maxy=s.y+s.h+pad;
    let ok=true;
    for(const [p,q] of [[-dx,x1-minx],[dx,maxx-x1],[-dy,y1-miny],[dy,maxy-y1]]){
      if(p===0){ if(q<0){ok=false;break;} }
      else{const t=q/p; if(p<0){ if(t>t1){ok=false;break;} if(t>t0)t0=t; } else { if(t<t0){ok=false;break;} if(t<t1)t1=t; }}
    }
    if(ok&&t0<=t1) return true;
  }
  return false;
}

/* ================= 길찾기 (흐름장) ================= */
const field=new Int16Array(COLS*ROWS); let fieldCell=-1, fieldT=0;
const cellOf=(x,y)=>clamp(Math.floor(y/CELL),0,ROWS-1)*COLS+clamp(Math.floor(x/CELL),0,COLS-1);
function buildField(tx,ty){
  const start=cellOf(tx,ty); field.fill(-1);
  const q=new Int16Array(COLS*ROWS); let h=0,t=0; q[t++]=start; field[start]=0;
  while(h<t){
    const c=q[h++], d=field[c]+1, cx=c%COLS, cy=(c-cx)/COLS;
    if(cx>0){const n=c-1; if(!blocked[n]&&field[n]<0){field[n]=d;q[t++]=n;}}
    if(cx<COLS-1){const n=c+1; if(!blocked[n]&&field[n]<0){field[n]=d;q[t++]=n;}}
    if(cy>0){const n=c-COLS; if(!blocked[n]&&field[n]<0){field[n]=d;q[t++]=n;}}
    if(cy<ROWS-1){const n=c+COLS; if(!blocked[n]&&field[n]<0){field[n]=d;q[t++]=n;}}
  }
  fieldCell=start;
}
function steer(k,tx,ty){
  if(!segHits(k.x,k.y,tx,ty,R_K+2)) return {x:tx,y:ty};
  if(cellOf(tx,ty)!==fieldCell||fieldT<=0){buildField(tx,ty);fieldT=.35;}
  const c=cellOf(k.x,k.y), cx=c%COLS, cy=(c-cx)/COLS;
  let best=-1, bd=field[c]<0?1e9:field[c];
  for(const [ox,oy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=cx+ox, ny=cy+oy; if(nx<0||ny<0||nx>=COLS||ny>=ROWS) continue;
    const n=ny*COLS+nx; if(blocked[n]||field[n]<0) continue;
    if(field[n]<bd){bd=field[n];best=n;}
  }
  if(best<0) return {x:tx,y:ty};
  // 두 칸 앞까지 보이면 더 매끄럽게
  const bx=best%COLS, by=(best-bx)/COLS;
  return {x:bx*CELL+CELL/2, y:by*CELL+CELL/2};
}

/* ================= 소리 (Web Audio) ================= */
let AC=null, master=null, muted=store('fm_mute')==='1';
function initAudio(){
  try{
    if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=muted?0:.9; master.connect(AC.destination);}
    if(AC.state==='suspended') AC.resume();
  }catch(e){AC=null;}
}
function tone(f,dur,type,vol,f2,when){
  if(!AC) return; const t=AC.currentTime+(when||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.03);
}
function heartbeat(v){ tone(78,.16,'sine',v,38); tone(64,.2,'sine',v*.75,32,.15); }
const sfx={
  hit(){tone(220,.35,'sawtooth',.35,50); tone(90,.4,'square',.25,40);},
  fix(){tone(rand(500,900),.05,'square',.05);},
  done(){tone(523,.12,'triangle',.3); tone(659,.12,'triangle',.3,0,.11); tone(784,.22,'triangle',.3,0,.22);},
  open(){[392,523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.3,0,i*.1));},
  ab(){tone(400,.18,'triangle',.25,900);},
  stun(){tone(900,.1,'square',.2,300); tone(300,.25,'triangle',.25,150,.08);},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.22,'triangle',.3,0,i*.13));},
  lose(){[392,349,311,196].forEach((f,i)=>tone(f,.35,'sawtooth',.22,f*.9,i*.25));},
  spot(){tone(180,.3,'sawtooth',.18,360);}
};

let state='menu', sel=-1, P=null, K=null, T=0, parts=[], pizzas=[], ghosts=[], shake=0, exitOpen=false, exitGlow=0;
let beatT=0, pulse=0, toastT=0, abWas=false, near=null, danger=0;

function toast(s,t){const el=$('#toast'); el.textContent=s; el.classList.add('on'); toastT=t||1.5;}

/* ================= 업데이트 ================= */
function spawn(x,y,n,color,sp,life,size){
  for(let i=0;i<n;i++){const a=rand(0,6.283), v=rand(sp*.3,sp); parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rand(life*.5,life),m:life,c:color,s:size||4});}
}
function useAbility(){
  if(P.cd>0) return; P.cd=CD; sfx.ab();
  const k=P.ch.key;
  if(k==='dash'){P.dash=.16; spawn(P.x,P.y-30,10,'#fff',160,.4,4);}
  else if(k==='speed'){P.boost=3;}
  else if(k==='invis'){P.invis=2; spawn(P.x,P.y-40,14,'#c9a6ff',120,.6,5);}
  else if(k==='pizza'){
    let dx=P.dirx, dy=P.diry;
    const d=dist(P,K);                       // 킬러가 보이면 그쪽으로 살짝 조준 도움
    if(d<520&&!segHits(P.x,P.y,K.x,K.y,0)){dx=(K.x-P.x)/d; dy=(K.y-P.y)/d;}
    pizzas.push({x:P.x,y:P.y,vx:dx*560,vy:dy*560,l:.95,rot:0});
  }
}
function update(dt){
  T+=dt;
  // ---- 플레이어 ----
  let mx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0)+inp.jx;
  let my=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0)+inp.jy;
  const ml=Math.hypot(mx,my); if(ml>1){mx/=ml;my/=ml;}
  P.moving=ml>.12;
  if(P.moving){const l=Math.hypot(mx,my); P.dirx=mx/l; P.diry=my/l; if(Math.abs(mx)>.15) P.face=mx>0?1:-1;}
  const wantFix=keys.Space||btn.fix, wantAb=keys.ShiftLeft||keys.ShiftRight||btn.ab;
  if(abQ||(wantAb&&!abWas)) useAbility(); abQ=false; abWas=wantAb;

  let sp=P_SPEED*(P.boost>0?1.65:1);
  if(P.dash>0){ P.dash-=dt; moveBy(P,P.dirx*1150*dt,P.diry*1150*dt,R_P); ghosts.push({x:P.x,y:P.y,f:P.face,l:.25}); }
  else if(P.moving) moveBy(P,mx*sp*dt,my*sp*dt,R_P);
  if(P.moving||P.dash>0) P.walk+=dt*(P.boost>0?16:11); else P.walk=0;
  if(P.boost>0){P.boost-=dt; if(Math.random()<.5) parts.push({x:P.x+rand(-8,8),y:P.y,vx:-P.dirx*40,vy:-P.diry*40-20,l:.35,m:.35,c:'#ffd65a',s:5});}
  if(P.invis>0) P.invis-=dt;
  if(P.inv>0) P.inv-=dt;
  if(P.cd>0) P.cd=Math.max(0,P.cd-dt);

  // ---- 발전기 ----
  near=null; let nd=FIX_RANGE;
  for(const g of gens){ if(g.done) continue; const d=Math.hypot(P.x-clamp(P.x,g.x,g.x+g.w),P.y-clamp(P.y,g.y,g.y+g.h)); if(d<nd-36){nd=d+36;near=g;} }
  P.fixing=!!(near&&wantFix&&P.dash<=0);
  if(P.fixing){
    near.prog+=dt/FIX_TIME; near.spark-=dt;
    if(near.spark<=0){near.spark=.12; sfx.fix(); spawn(near.cx+rand(-30,30),near.cy-10,2,'#ffe27a',140,.35,3);}
    if(near.prog>=1){
      near.prog=1; near.done=true; spawn(near.cx,near.cy-10,26,'#ffe27a',260,.8,5); updHud();
      const n=gens.filter(g=>g.done).length;
      if(n===4){exitOpen=true; sfx.open(); toast('출구가 열렸다!',2.2); $('#goal').textContent='오른쪽 초록 문으로 달려!'; $('#goal').classList.add('open');}
      else{sfx.done(); toast(`발전기 ${n}/4 수리 완료!`,1.4);}
    }
  }
  // ---- 출구 ----
  if(exitOpen){ exitGlow+=dt; if(P.x>W-WALL-R_P-6&&P.y>EXIT.y&&P.y<EXIT.y+EXIT.h){endGame(true);return;} }

  // ---- 킬러 ----
  updKiller(dt);

  // ---- 피자 ----
  for(const z of pizzas){
    z.l-=dt; z.rot+=dt*14; const ox=z.x, oy=z.y; z.x+=z.vx*dt; z.y+=z.vy*dt;
    if(Math.hypot(z.x-K.x,z.y-(K.y-10))<42){z.l=0; K.stun=2; K.state='patrol'; sfx.stun(); spawn(K.x,K.y-50,18,'#ffb347',220,.7,5); toast('명중! 킬러가 멈췄다',1.2);}
    else if(segHits(ox,oy,z.x,z.y,0)||z.x<WALL||z.x>W-WALL||z.y<WALL||z.y>H-WALL){z.l=0; spawn(z.x,z.y,8,'#ffb347',120,.4,4);}
  }
  pizzas=pizzas.filter(z=>z.l>0);
  for(const p of parts){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;}
  parts=parts.filter(p=>p.l>0);
  for(const g of ghosts) g.l-=dt; ghosts=ghosts.filter(g=>g.l>0);
  if(shake>0) shake-=dt;

  // ---- 위험도 → 붉은 화면 + 심장 소리 ----
  const d=dist(P,K), target=clamp(1-(d-140)/(640-140),0,1);
  danger=lerp(danger,target,1-Math.exp(-dt*5));
  pulse=Math.max(0,pulse-dt*3);
  if(danger>.04){ beatT-=dt; if(beatT<=0){ beatT=lerp(1.15,.36,danger); pulse=1; heartbeat(.15+danger*.6); } } else beatT=0;

  // ---- HUD ----
  $('#time').textContent=fmt(T);
  const ab=$('#bAb'); ab.classList.toggle('wait',P.cd>0); ab.style.setProperty('--cd',(P.cd/CD*360)+'deg'); if(P.cd>0) $('#abNum').textContent=Math.ceil(P.cd);
  $('#bFix').classList.toggle('near',!!near&&!P.fixing);
  if(toastT>0){toastT-=dt; if(toastT<=0) $('#toast').classList.remove('on');}
}
function updKiller(dt){
  const k=K;
  if(k.spotted>0) k.spotted-=dt;
  if(k.stun>0){k.stun-=dt; k.moving=false; return;}
  if(k.pause>0){k.pause-=dt; k.moving=false; return;}
  fieldT-=dt;
  const d=dist(k,P), vis=P.invis<=0;
  const sees=vis&&d<SIGHT&&!segHits(k.x,k.y,P.x,P.y,0);
  const prev=k.state;
  if(!vis) k.state='patrol';
  else if(sees){k.state='chase';k.lost=0;}
  else if(k.state==='chase'&&d<SIGHT*1.4&&k.lost<1.4){k.lost+=dt;}
  else if(d<TRACK) k.state='track';
  else k.state='patrol';
  if(k.state==='chase'&&prev!=='chase'){k.spotted=.9; sfx.spot();}

  let tx,ty,want;
  if(k.state==='patrol'){
    const w=WAYPTS[k.wp]; tx=w[0]; ty=w[1]; want=K_PATROL;
    if(Math.hypot(k.x-tx,k.y-ty)<34){
      // 가끔은 아직 안 고친 발전기 쪽으로 순찰
      const left=gens.filter(g=>!g.done);
      if(left.length&&Math.random()<.35){const g=left[Math.floor(Math.random()*left.length)]; let bi=0,bd=1e9; WAYPTS.forEach((p,i)=>{const dd=Math.hypot(p[0]-g.cx,p[1]-g.cy); if(dd<bd){bd=dd;bi=i;}}); k.wp=bi===k.wp?(bi+1)%WAYPTS.length:bi;}
      else k.wp=(k.wp+1+Math.floor(Math.random()*3))%WAYPTS.length;
    }
  }else{tx=P.x;ty=P.y;want=k.state==='chase'?K_CHASE:K_TRACK;}
  k.spd=lerp(k.spd,want,1-Math.exp(-dt*3));
  const s=steer(k,tx,ty); let dx=s.x-k.x, dy=s.y-k.y; const l=Math.hypot(dx,dy);
  if(l>1){dx/=l;dy/=l; moveBy(k,dx*k.spd*dt,dy*k.spd*dt,R_K); if(Math.abs(dx)>.25) k.face=dx>0?1:-1; k.moving=true; k.walk+=dt*(k.state==='chase'?12:7);} else k.moving=false;

  // 닿으면 체력 -1, 2초 무적, 화면 흔들림
  if(d<R_P+R_K+6&&P.inv<=0&&P.invis<=0){
    P.hp--; P.inv=2; shake=.55; k.pause=1.1; sfx.hit(); spawn(P.x,P.y-40,16,'#ff5468',240,.6,5); updHud();
    if(P.hp<=0){endGame(false);}
  }
}

/* ================= 그리기 ================= */
const cv=$('#cv'), cx=cv.getContext('2d'); let cw=0,ch=0,dpr=1,scale=1,camX=0,camY=0;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2); cw=innerWidth; ch=innerHeight;
  cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr);
  scale=clamp(Math.sqrt(cw*ch/(900*560)),.8,1.7);
  if(document.body.classList.contains('touch')&&joyId===null) joyHome();
}
addEventListener('resize',resize); addEventListener('orientationchange',()=>setTimeout(resize,200));

function drawSprite(id,x,y,h,face,walk,moving,alpha){
  const g=GLOW[id]; if(!g) return;
  const k=h/g.h, bob=moving?Math.abs(Math.sin(walk))*7:0, sq=moving?1+Math.sin(walk*2)*.04:1;
  // 그림자
  cx.fillStyle='rgba(0,0,0,.4)'; cx.beginPath(); cx.ellipse(x,y+3,h*.26-bob*.6,h*.08-bob*.2,0,0,6.283); cx.fill();
  cx.save(); cx.globalAlpha=alpha; cx.translate(x,y+4-bob); cx.scale(face*k,k*sq);
  cx.drawImage(g.c,-g.w/2-g.pad,-g.h-g.pad);
  cx.restore();
}
function drawGen(g,t){
  const x=g.x,y=g.y-18,w=g.w,h=g.h+18;
  cx.fillStyle='rgba(0,0,0,.35)'; cx.fillRect(x+6,y+12,w,h);
  cx.fillStyle=g.done?'#3d6b4a':'#4b4f63'; cx.fillRect(x,y,w,h);
  cx.fillStyle=g.done?'#57946a':'#666b85'; cx.fillRect(x,y,w,12);
  cx.strokeStyle='#1c1a26'; cx.lineWidth=3; cx.strokeRect(x+1.5,y+1.5,w-3,h-3);
  cx.fillStyle='#1c1a26'; for(let i=0;i<4;i++) cx.fillRect(x+12+i*9,y+22,5,22);
  // 램프
  const on=g.done||(P&&P.fixing&&near===g&&Math.sin(t*20)>0);
  cx.fillStyle=g.done?'#6dffa0':on?'#ffd65a':'#7a2b35';
  cx.beginPath(); cx.arc(x+w-16,y+28,7,0,6.283); cx.fill();
  if(g.done||on){cx.globalAlpha=.25; cx.beginPath(); cx.arc(x+w-16,y+28,16,0,6.283); cx.fill(); cx.globalAlpha=1;}
  // 게이지
  if(!g.done&&(g.prog>0||near===g)){
    const bw=w+10,bx=x-5,by=y-20;
    cx.fillStyle='rgba(10,6,20,.85)'; rr(bx,by,bw,12,6); cx.fill();
    cx.fillStyle='#ffd65a'; if(g.prog>0){rr(bx+2,by+2,Math.max(8,(bw-4)*g.prog),8,4); cx.fill();}
  }
  if(!g.done){ // 번호 대신 번개 표시
    cx.fillStyle='#ffd65a'; cx.beginPath(); const bx=x+w-36,by=y+18;
    cx.moveTo(bx+6,by); cx.lineTo(bx,by+12); cx.lineTo(bx+5,by+12); cx.lineTo(bx+2,by+22); cx.lineTo(bx+10,by+8); cx.lineTo(bx+5,by+8); cx.closePath(); cx.fill();
  }
}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
function label(s,x,y,size,color){
  cx.font=size+'px '+FONT; cx.textAlign='center'; cx.textBaseline='middle';
  cx.lineWidth=5; cx.strokeStyle='rgba(10,6,20,.9)'; cx.lineJoin='round'; cx.strokeText(s,x,y); cx.fillStyle=color; cx.fillText(s,x,y);
}
let FONT=getComputedStyle(document.body).fontFamily;
function arrow(wx,wy,color,t){
  const sx=(wx-camX)*scale, sy=(wy-camY)*scale, m=34;
  if(sx>m&&sx<cw-m&&sy>m+50&&sy<ch-m) return;
  const px=cw/2, py=ch/2, a=Math.atan2(sy-py,sx-px);
  const ex=clamp(sx,m,cw-m), ey=clamp(sy,m+56,ch-m), b=Math.sin(t*5)*3;
  cx.save(); cx.translate(ex+Math.cos(a)*b,ey+Math.sin(a)*b); cx.rotate(a);
  cx.fillStyle=color; cx.strokeStyle='rgba(10,6,20,.9)'; cx.lineWidth=3;
  cx.beginPath(); cx.moveTo(14,0); cx.lineTo(-10,-11); cx.lineTo(-4,0); cx.lineTo(-10,11); cx.closePath(); cx.stroke(); cx.fill(); cx.restore();
}
function render(t){
  cx.setTransform(dpr,0,0,dpr,0,0);
  cx.fillStyle='#0b0812'; cx.fillRect(0,0,cw,ch);
  if(!P) return;
  const vw=cw/scale, vh=ch/scale;
  camX=vw>=W?(W-vw)/2:clamp(P.x-vw/2,0,W-vw); camY=vh>=H?(H-vh)/2:clamp(P.y-40-vh/2,0,H-vh);
  let sx=0,sy=0; if(shake>0){const a=shake*22; sx=rand(-a,a); sy=rand(-a,a);}
  cx.save(); cx.translate(sx,sy); cx.scale(scale,scale); cx.translate(-camX,-camY);
  cx.drawImage(mapCv,0,0);

  // 출구
  const e=EXIT;
  if(exitOpen){
    const gl=.6+Math.sin(exitGlow*5)*.25;
    const gr=cx.createRadialGradient(e.x,e.y+e.h/2,10,e.x,e.y+e.h/2,260); gr.addColorStop(0,`rgba(109,255,160,${.45*gl})`); gr.addColorStop(1,'rgba(109,255,160,0)');
    cx.fillStyle=gr; cx.fillRect(e.x-260,e.y-200,300,e.h+400);
    cx.fillStyle='#6dffa0'; cx.fillRect(e.x,e.y,e.w,e.h);
    cx.fillStyle='#eafff1'; cx.fillRect(e.x+10,e.y+10,e.w-10,e.h-20);
    label('출구',e.x-34,e.y-18,22,'#6dffa0');
  }else{
    cx.fillStyle='#3a2c2c'; cx.fillRect(e.x,e.y,e.w,e.h);
    cx.strokeStyle='#7a2b35'; cx.lineWidth=4; cx.strokeRect(e.x+4,e.y+4,e.w-8,e.h-8);
    cx.beginPath(); cx.moveTo(e.x+6,e.y+e.h/2); cx.lineTo(e.x+e.w-6,e.y+e.h/2); cx.stroke();
  }
  for(const g of gens) drawGen(g,t);

  // 대시 잔상
  for(const g of ghosts) drawSprite(P.spr,g.x,g.y,P_H,g.f,0,false,g.l*1.6);
  // 캐릭터 (y 순서)
  const pa=P.invis>0?.32:(P.inv>0&&Math.floor(t*14)%2?.35:1);
  const drawP=()=>{drawSprite(P.spr,P.x,P.y,P_H,P.face,P.walk,P.moving||P.dash>0,pa);};
  const drawK=()=>{
    const wob=K.stun>0?Math.sin(t*30)*2:0;
    drawSprite(K.spr,K.x+wob,K.y,K_H,K.face,K.walk,K.moving,1);
    if(K.stun>0){for(let i=0;i<3;i++){const a=t*6+i*2.094; label('★',K.x+Math.cos(a)*26,K.y-K_H-6+Math.sin(a)*8,20,'#ffd65a');}}
    else if(K.spotted>0) label('!',K.x,K.y-K_H-14-Math.sin(K.spotted*10)*4,34,'#ff5468');
  };
  if(P.y<K.y){drawP();drawK();}else{drawK();drawP();}
  // 피자
  for(const z of pizzas){
    cx.save(); cx.translate(z.x,z.y-34); cx.rotate(z.rot);
    cx.fillStyle='#e8a33d'; cx.beginPath(); cx.moveTo(0,-15); cx.lineTo(13,12); cx.lineTo(-13,12); cx.closePath(); cx.fill();
    cx.fillStyle='#ffd65a'; cx.beginPath(); cx.moveTo(0,-9); cx.lineTo(9,8); cx.lineTo(-9,8); cx.closePath(); cx.fill();
    cx.fillStyle='#d83a3a'; cx.beginPath(); cx.arc(0,2,3,0,6.283); cx.arc(-3,6,2,0,6.283); cx.fill();
    cx.restore();
  }
  for(const p of parts){cx.globalAlpha=clamp(p.l/p.m,0,1); cx.fillStyle=p.c; cx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);} cx.globalAlpha=1;
  // 이름표 / 안내
  label(P.ch.name,P.x,P.y+22,15,'#f6efff');
  if(near&&!P.fixing) label(document.body.classList.contains('touch')?'수리 버튼을 꾹!':'스페이스를 꾹!',near.cx,near.y-56-Math.sin(t*6)*3,18,'#ffd65a');
  if(P.fixing) label('수리 중… '+Math.floor(near.prog*100)+'%',near.cx,near.y-56,18,'#ffd65a');
  cx.restore();

  // 어둠 (플레이어 주변만 밝게)
  const px=(P.x-camX)*scale+sx, py=(P.y-40-camY)*scale+sy, R=Math.max(cw,ch);
  let gr=cx.createRadialGradient(px,py,110*scale,px,py,470*scale);
  gr.addColorStop(0,'rgba(8,5,16,0)'); gr.addColorStop(.6,'rgba(8,5,16,.5)'); gr.addColorStop(1,'rgba(8,5,16,.72)');
  cx.fillStyle=gr; cx.fillRect(0,0,cw,ch);
  // 킬러가 가까우면 가장자리가 붉게
  if(danger>.02){
    const a=danger*(.5+pulse*.3);
    gr=cx.createRadialGradient(cw/2,ch/2,Math.min(cw,ch)*lerp(.55,.25,danger),cw/2,ch/2,R*.72);
    gr.addColorStop(0,'rgba(255,20,50,0)'); gr.addColorStop(1,`rgba(255,20,50,${a})`);
    cx.fillStyle=gr; cx.fillRect(0,0,cw,ch);
  }
  if(P.inv>1.75){cx.fillStyle=`rgba(255,40,70,${(P.inv-1.75)*1.6})`; cx.fillRect(0,0,cw,ch);}
  // 방향 화살표
  if(exitOpen) arrow(EXIT.x,EXIT.y+EXIT.h/2,'#6dffa0',t);
  else for(const g of gens) if(!g.done) arrow(g.cx,g.cy,'#ffd65a',t);
}

/* ================= 루프 ================= */
let last=0;
function frame(ms){
  const t=ms/1000; let dt=Math.min(.034,t-last||0); last=t;
  if(state==='play') update(dt);
  render(t);
  requestAnimationFrame(frame);
}

/* ================= 메뉴 ================= */
function buildMenu(){
  const box=$('#cards'); let saved={}; try{saved=JSON.parse(store('fm_names')||'{}')||{};}catch(e){}
  CHARS.forEach((c,i)=>{
    if(saved[c.id]) c.name=saved[c.id];
    const el=document.createElement('div'); el.className='card'; el.tabIndex=0;
    el.innerHTML=`<div class="pic"><img alt="" src="${SPR[c.id].d}"></div>
      <input maxlength="8" aria-label="이름" placeholder="이름">
      <div class="ab">능력 · ${c.ab}</div><div class="ds">${c.ds}</div>`;
    const inpEl=el.querySelector('input'); inpEl.value=c.name;
    inpEl.addEventListener('input',()=>{c.name=inpEl.value.trim()||'생존자'; saved[c.id]=c.name; store('fm_names',JSON.stringify(saved));});
    const pick=()=>{sel=i; document.querySelectorAll('.card').forEach((x,j)=>x.classList.toggle('sel',j===i)); const b=$('#go'); b.disabled=false; b.textContent='게임 시작!';};
    el.addEventListener('click',pick);
    el.addEventListener('keydown',e=>{if(e.target===el&&(e.code==='Enter'||e.code==='Space')){e.preventDefault();pick();}});
    box.appendChild(el);
  });
}
$('#go').addEventListener('click',()=>{ if(sel>=0) startGame(); });
$('#again').addEventListener('click',startGame);
$('#toMenu').addEventListener('click',()=>{state='menu'; P=null; $('#end').classList.remove('on'); $('#menu').classList.add('on');});
const muteBtn=$('#mute'); const paintMute=()=>{muteBtn.textContent=muted?'🔇':'🔊';}; paintMute();
muteBtn.addEventListener('click',()=>{muted=!muted; store('fm_mute',muted?'1':'0'); if(master) master.gain.value=muted?0:.9; paintMute();});
document.addEventListener('visibilitychange',()=>{ if(AC){ if(document.hidden) AC.suspend(); else if(state==='play') AC.resume(); } last=performance.now()/1000; });

buildWorld(); paintMap(); buildMenu(); resize(); requestAnimationFrame(frame);
</script>
